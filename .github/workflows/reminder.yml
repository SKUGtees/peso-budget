name: Daily spending reminder

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-save web-push
      - name: Check reminder and send if due
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node .github/scripts/reminder-check.mjs
      - name: Commit updated state (if changed)
        run: |
          git config user.name "reminder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/reminder-settings.json .github/reminder-sent.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update reminder state [skip ci]"
          git push || true
