name: Build Android App (Capacitor + AdMob)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets
        run: node scripts/prepare-www.js

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ folder yet — scaffolding it now."
            npx cap add android
            NEW_PLATFORM=true
          else
            echo "android/ already exists, skipping cap add."
            NEW_PLATFORM=false
          fi
          echo "NEW_PLATFORM=$NEW_PLATFORM" >> "$GITHUB_ENV"

      - name: Wire up AdMob (first run only, uses Google's public TEST App ID until real one is set)
        if: env.NEW_PLATFORM == 'true'
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          STRINGS=android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"admob_app_id\">.*</string>#<string name=\"admob_app_id\">$ADMOB_APP_ID</string>#" "$STRINGS" 2>/dev/null || true
          if ! grep -q "admob_app_id" "$STRINGS"; then
            sed -i "s#</resources>#    <string name=\"admob_app_id\">$ADMOB_APP_ID</string>\n</resources>#" "$STRINGS"
          fi
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"@string/admob_app_id\"/>\n    </application>#" "$MANIFEST"
          fi
          echo "AdMob App ID wired into manifest: $ADMOB_APP_ID"

      - name: Sync Capacitor (copies web assets + plugins into native project)
        run: npx cap sync android

      - uses: android-actions/setup-android@v3

      - name: Reconstruct signing keystore from secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Run the 'Generate Android signing keystore' workflow first, then add its output as repo secrets."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - name: Build signed release AAB
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-key.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=pesobudget \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Commit generated android/ project (first run only)
        if: env.NEW_PLATFORM == 'true'
        run: |
          git config user.name "build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/
          git commit -m "Add generated Capacitor Android project [skip ci]"
          git push

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: peso-budget-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
