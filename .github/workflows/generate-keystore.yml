name: Generate Android signing keystore (run once)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore and password
        run: |
          PASSWORD=$(openssl rand -base64 24)
          keytool -genkeypair -v -keystore release-key.jks -alias pesobudget \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Peso Budget, OU=SKUGtees, O=SKUGtees, L=Unknown, S=Unknown, C=MX"
          base64 -w0 release-key.jks > release-key.b64.txt
          echo "$PASSWORD" > keystore-password.txt
          echo "Keystore and password generated. Download the artifact below, copy each file's content into a GitHub Actions secret, then delete this workflow run."

      - name: Upload keystore materials (download once, then add as repo secrets)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-materials-DELETE-AFTER-USE
          path: |
            release-key.b64.txt
            keystore-password.txt
          retention-days: 1
